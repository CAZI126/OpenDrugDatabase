name: ODD CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odd-001-002-003-004-005-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check ODD-001 through ODD-005 (strict)
        run: python -m mypy src/odd
      - name: Verify raw fixture integrity
        run: python scripts/verify_fixture_integrity.py
      - name: Verify genuine two-version temporal artifact independently
        run: python scripts/verify_temporal_diff.py
      - name: Verify ODD-003 utilization-list integrity
        run: python scripts/verify_odd003_utilization.py
      - name: Verify ODD-004 live-observation contract offline
        run: python scripts/verify_odd004_live_contract.py
      - name: Verify ODD-005 enrichment contract offline
        run: python scripts/verify_odd005_enrichment_contract.py
      - name: Test
        run: python -m pytest
      - name: Verify deterministic serialization independently
        run: >-
          python -m pytest
          tests/parsers/test_spl_parser.py::test_repeated_parsing_is_byte_deterministic
      - name: Verify deterministic temporal diff independently
        run: >-
          python -m pytest
          tests/diffs/test_genuine_temporal_diff.py::test_canonical_diff_is_timestamp_independent_and_idempotent
      - name: Verify ODD-003 candidate-selection determinism independently
        run: >-
          python -m pytest
          tests/connectors/test_dailymed_batch_selection.py::test_response_order_does_not_change_winner_or_evidence_order
      - name: Verify ODD-003 batch-report determinism independently
        run: >-
          python -m pytest
          tests/batch/test_batch_execution.py::test_batch_report_items_and_diagnostics_are_deterministic
      - name: Verify database v2 to v3 migration independently
        run: >-
          python -m pytest
          tests/storage/test_batch_storage.py::test_v2_to_v3_migration_preserves_source_diff_and_verification
      - name: Verify additive database v3 to v4 migration independently
        run: >-
          python -m pytest
          tests/storage/test_batch_storage.py::test_fresh_and_v3_to_v4_migrated_schema_contracts_match
          tests/storage/test_batch_storage.py::test_v4_migration_failure_rolls_back_the_entire_schema_change
      - name: Verify ODD-004 pagination and snapshot determinism independently
        run: >-
          python -m pytest
          tests/connectors/test_dailymed_live_discovery.py::test_discover_retrieves_and_hashes_every_advertised_page
          tests/connectors/test_dailymed_live_discovery.py::test_response_order_changes_exact_snapshot_but_not_candidate_order_or_result
          tests/connectors/test_dailymed_live_discovery.py::test_same_exact_response_ignores_retrieval_timestamp_in_snapshot_identity
          tests/connectors/test_dailymed_live_discovery.py::test_different_response_bytes_produce_a_different_snapshot_identity
          tests/connectors/test_dailymed_live_discovery.py::test_default_transport_blocks_off_origin_redirect_before_following
      - name: Verify ODD-004 resume and item isolation independently
        run: >-
          python -m pytest
          tests/batch/test_live_batch_execution.py::test_resume_never_performs_additional_candidate_discovery
          tests/batch/test_live_batch_execution.py::test_completed_resume_preserves_terminal_state_and_database_bytes
          tests/batch/test_live_batch_execution.py::test_one_live_fetch_failure_does_not_rollback_other_ingredients
          tests/batch/test_live_batch_execution.py::test_permanent_live_fetch_failure_is_not_retried_on_resume
      - name: Verify ODD-004 canonical report and artifact integrity independently
        run: >-
          python -m pytest
          tests/batch/test_live_batch_execution.py::test_canonical_live_report_ignores_run_id_and_detects_tampering
      - name: Verify additive database v4 to v5 migration independently
        run: >-
          python -m pytest
          tests/storage/test_batch_storage.py::test_fresh_and_v4_to_v5_migrated_schema_contracts_match
          tests/storage/test_batch_storage.py::test_v5_migration_failure_rolls_back_the_entire_schema_change
      - name: Verify ODD-005 evidence and selection completeness independently
        run: >-
          python -m pytest
          tests/enrichment/test_evidence_extraction.py
      - name: Verify ODD-005 budget, resume, drift, revision, and integrity independently
        run: >-
          python -m pytest
          tests/enrichment/test_enrichment_execution.py
      - name: Verify ODD-005 HTTP safety independently
        run: >-
          python -m pytest
          tests/connectors/test_dailymed_enrichment.py
      - name: Verify batch artifact integrity independently
        run: >-
          python -m pytest
          tests/storage/test_batch_storage.py::test_batch_artifact_is_idempotent_and_integrity_checked
