[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opendrugdatabase"
version = "0.5.0"
description = "Provenance-preserving DailyMed ingestion, live snapshots, and enrichment"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "OpenDrugDatabase contributors" }]
dependencies = []

[project.optional-dependencies]
# The MCP server is an optional entry point. Core install stays dependency-free.
mcp = [
    "mcp>=1.0,<2",
]
dev = [
    # Contributors get the MCP SDK too, so tests/mcp runs rather than skipping.
    "mcp>=1.0,<2",
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
# The official ODD entry point is the core path and nothing else.
odd = "odd.core.cli:main"
# Retained, not removed: the ODD-001..005 batch, enrichment, lineage, and diff commands.
odd-legacy = "odd.cli.main:main"
# The MCP server over that same core path; needs the optional [mcp] extra.
odd-mcp = "odd.mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
odd = ["resources/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["odd"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The MCP SDK is an optional extra; a core-only install still type-checks.
module = ["mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The SDK registers handlers through its own untyped decorators. Strict mode
# cannot see through them, and this module is transport wiring only -- every
# fact it returns is produced and checked in odd.mcp.tools.
module = ["odd.mcp.server"]
disallow_untyped_calls = false
disallow_untyped_decorators = false
